<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="PdfReader - lokale PDF reader voor Android en Windows">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>PdfReader</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">PDF</div>
      <div class="brand-text">
        <h1>PdfReader</h1>
        <span class="version-badge">v0.1.2</span>
      </div>
    </div>

    <label class="file-button" for="fileInput">PDF openen</label>
    <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
  </header>

  <main>
    <section id="welcome" class="welcome panel">
      <h2>Open een PDF vanaf je toestel</h2>
      <p>De PDF wordt lokaal in de browser verwerkt. Deze app stuurt het document niet naar een eigen server.</p>
      <label class="primary-button" for="fileInput">Kies PDF</label>
      <div class="feature-row">
        <span>Android</span>
        <span>Windows</span>
        <span>GitHub Pages</span>
        <span>PWA</span>
      </div>
    </section>

    <section id="reader" class="reader hidden" aria-live="polite">
      <div class="toolbar panel">
        <div class="toolbar-group nav-group">
          <button id="prevPage" type="button" title="Vorige pagina" aria-label="Vorige pagina">←</button>
          <div class="page-control">
            <input id="pageNumber" type="number" min="1" value="1" aria-label="Paginanummer">
            <span>/ <strong id="pageCount">0</strong></span>
          </div>
          <button id="nextPage" type="button" title="Volgende pagina" aria-label="Volgende pagina">→</button>
        </div>

        <div class="toolbar-group zoom-group">
          <button id="zoomOut" type="button" title="Uitzoomen" aria-label="Uitzoomen">−</button>
          <span id="zoomLabel">100%</span>
          <button id="zoomIn" type="button" title="Inzoomen" aria-label="Inzoomen">+</button>
          <button id="fitWidth" type="button" class="fit-button" title="Passend op breedte">Breedte</button>
        </div>
      </div>

      <div class="reader-meta">
        <div id="status" class="status">Geen PDF geladen.</div>
        <div id="fileName" class="filename"></div>
      </div>

      <div id="canvasWrap" class="canvas-wrap">
        <canvas id="pdfCanvas"></canvas>
      </div>
    </section>
  </main>

  <footer>
    <span>PdfReader v0.1.2</span>
    <a href="https://gasvdv-lab.github.io/PdfReader/" target="_blank" rel="noopener">Live app</a>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
