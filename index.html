<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="PdfReader - lokale PDF reader voor Android en Windows">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>PdfReader</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">PDF</div>
      <div class="brand-text">
        <h1>PdfReader</h1>
        <span class="version-badge">v0.2.0.1</span>
      </div>
    </div>

    <div class="header-actions">
      <button id="toggleSidebar" class="secondary-button" type="button" title="Miniaturen">☰</button>
      <label class="file-button" for="fileInput">PDF openen</label>
      <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
    </div>
  </header>

  <main>
    <section id="welcome" class="welcome panel">
      <h2>Open een PDF vanaf je toestel</h2>
      <p>De PDF wordt lokaal in je browser verwerkt. Deze app stuurt het document niet naar een eigen server.</p>
      <label class="primary-button" for="fileInput">Kies PDF</label>
      <div class="feature-row">
        <span>Android</span>
        <span>Windows</span>
        <span>Scrollmodus</span>
        <span>Zoeken</span>
        <span>Thumbnails</span>
      </div>
    </section>

    <section id="reader" class="reader hidden" aria-live="polite">
      <div class="toolbar panel">
        <div class="toolbar-row">
          <div class="toolbar-group">
            <button id="prevPage" type="button" title="Vorige pagina">←</button>
            <div class="page-control">
              <input id="pageNumber" type="number" min="1" value="1" aria-label="Paginanummer">
              <span>/ <strong id="pageCount">0</strong></span>
            </div>
            <button id="nextPage" type="button" title="Volgende pagina">→</button>
          </div>

          <div class="toolbar-group">
            <button id="zoomOut" type="button" title="Uitzoomen">−</button>
            <span id="zoomLabel">100%</span>
            <button id="zoomIn" type="button" title="Inzoomen">+</button>
            <button id="fitWidth" type="button">Breedte</button>
            <button id="fitPage" type="button">Pagina</button>
          </div>
        </div>

        <div class="toolbar-row search-row">
          <div class="search-box">
            <input id="searchInput" type="search" placeholder="Zoek tekst in PDF…" autocomplete="off">
            <button id="searchButton" type="button">Zoek</button>
            <button id="searchPrev" type="button" title="Vorige resultaat">↑</button>
            <button id="searchNext" type="button" title="Volgende resultaat">↓</button>
          </div>
          <div id="searchStatus" class="search-status">Geen zoekopdracht</div>
        </div>
      </div>

      <div class="reader-meta">
        <div id="status" class="status">Geen PDF geladen.</div>
        <div id="fileName" class="filename"></div>
      </div>

      <div class="reader-layout">
        <aside id="sidebar" class="sidebar panel">
          <div class="sidebar-title">Pagina's</div>
          <div id="thumbnails" class="thumbnails"></div>
        </aside>

        <div id="scrollContainer" class="scroll-container">
          <div id="pages" class="pages"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span>PdfReader v0.2.0.1</span>
    <div class="footer-actions">
      <button id="checkUpdate" class="link-button" type="button">Controleer update</button>
      <a href="https://gasvdv-lab.github.io/PdfReader/" target="_blank" rel="noopener">Live app</a>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
